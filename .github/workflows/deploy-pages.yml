name: Deploy public site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            demos/package-lock.json
            demos/public_site/package-lock.json
      - name: Install demos dependencies
        working-directory: demos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install site dependencies
        working-directory: demos/public_site
        run: npm ci --no-audit --no-fund
      - name: Build the site
        working-directory: demos/public_site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run build
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demos/public_site/dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
