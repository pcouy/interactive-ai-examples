name: Deploy public site to Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            demos/package-lock.json
            demos/public_site/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install demos dependencies
        working-directory: demos
        run: npm ci --ignore-scripts
      - name: Install site dependencies
        working-directory: demos/public_site
        run: npm ci
      - name: Build and verify the site
        working-directory: demos/public_site
        run: npm run verify:full
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demos/public_site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
