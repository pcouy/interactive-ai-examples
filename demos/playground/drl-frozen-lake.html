<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drl-frozen-lake — Playground</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 1rem;
        margin: 0 auto;
      }

      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="./index.html">← Playground</a></p>
      <drl-card heading="drl-frozen-lake">
        <drl-frozen-lake speed="1"></drl-frozen-lake>
        <p>
          <drl-slider
            label="Learning rate"
            min="0.05"
            max="1"
            step="0.05"
            value="0.1"
          ></drl-slider>
        </p>
      </drl-card>
    </main>
    <script type="module" src="/src/index.ts"></script>
    <script type="module">
      const demo = document.querySelector('drl-frozen-lake');
      const slider = document.querySelector('drl-slider');
      slider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.learningRate = event.detail;
        }
      });
    </script>
  </body>
</html>
