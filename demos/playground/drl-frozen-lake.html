<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frozen Lake — Q-learning tabulaire</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 1rem;
        max-width: 640px;
        margin: 0 auto;
      }

      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="./index.html">← Playground</a></p>
      <drl-card heading="Frozen Lake — démonstration interactive">
        <p>
          Un agent apprend à traverser un lac gelé sans tomber dans un trou. Il découvre
          la valeur de chaque paire case/action par essais et erreurs. Epsilon contrôle
          l'exploration aléatoire. Les flèches indiquent le meilleur déplacement pour
          chaque case au fil de l'apprentissage.
        </p>
        <drl-frozen-lake speed="1"></drl-frozen-lake>
        <p>
          <drl-slider
            data-param="learning-rate"
            label="Taux d'apprentissage"
            min="0.01"
            max="1"
            step="0.01"
            value="0.1"
          ></drl-slider>
        </p>
        <p>
          <drl-slider
            data-param="epsilon"
            label="Epsilon (exploration)"
            min="0"
            max="1"
            step="0.01"
            value="0.1"
          ></drl-slider>
        </p>
        <p>
          <drl-slider
            data-param="discount-factor"
            label="Facteur d'actualisation"
            min="0.5"
            max="1"
            step="0.01"
            value="0.99"
          ></drl-slider>
        </p>
        <p>
          <drl-slider
            data-param="slip-probability"
            label="Glissade (probabilité)"
            min="0"
            max="1"
            step="0.05"
            value="0"
          ></drl-slider>
        </p>
        <p>
          <drl-slider
            data-param="initial-value"
            label="Valeur initiale Q"
            min="-1"
            max="5"
            step="0.1"
            value="0"
          ></drl-slider>
        </p>
      </drl-card>
    </main>
    <script type="module" src="/src/index.ts"></script>
    <script type="module">
      const demo = document.querySelector('drl-frozen-lake');
      const learningRateSlider = document.querySelector('[data-param="learning-rate"]');
      learningRateSlider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.learningRate = event.detail;
        }
      });
      const epsilonSlider = document.querySelector('[data-param="epsilon"]');
      epsilonSlider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.epsilon = event.detail;
        }
      });
      const discountFactorSlider = document.querySelector('[data-param="discount-factor"]');
      discountFactorSlider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.discountFactor = event.detail;
        }
      });
      const slipProbabilitySlider = document.querySelector('[data-param="slip-probability"]');
      slipProbabilitySlider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.slipProbability = event.detail;
        }
      });
      const initialValueSlider = document.querySelector('[data-param="initial-value"]');
      initialValueSlider?.addEventListener('drl-input', (event) => {
        if (demo) {
          demo.initialValue = event.detail;
        }
      });
    </script>
  </body>
</html>
